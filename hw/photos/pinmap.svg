<text x="412" y="295" font-size="17" font-weight="700" fill="#111A2E" text-anchor="start">GND</text>
<text x="412" y="312" font-size="12" fill="#5A6578" text-anchor="start">ground</text>
<rect x="611" y="369" width="18" height="22" rx="4" fill="#111A2E"/>
<text x="598" y="379" font-size="17" font-weight="700" fill="#111A2E" text-anchor="end">D5</text>
<text x="598" y="396" font-size="12" fill="#5A6578" text-anchor="end">PE10 · USART3 TX</text>
<rect x="611" y="417" width="18" height="22" rx="4" fill="#111A2E"/>
<text x="598" y="427" font-size="17" font-weight="700" fill="#111A2E" text-anchor="end">A5</text>
<text x="598" y="444" font-size="12" fill="#5A6578" text-anchor="end">PB10 · USART3 RX</text>
<rect x="611" y="465" width="18" height="22" rx="4" fill="#111A2E"/>
<text x="598" y="475" font-size="17" font-weight="700" fill="#111A2E" text-anchor="end">GND</text>
<text x="598" y="492" font-size="12" fill="#5A6578" text-anchor="end">ground</text>
