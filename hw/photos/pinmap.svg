<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="628" viewBox="0 0 1000 628" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1000" height="628" fill="#FFFFFF"/>
<text x="28" y="44" font-size="26" font-weight="700" fill="#111A2E">Guardian-TRON cable colour map</text>
<text x="28" y="70" font-size="15" fill="#5A6578">STM32N6570-DK Arduino header, as wired on the car. All signals are 3.3 V.</text>
<rect x="390" y="110" width="230" height="430" rx="14" fill="#FBFBF8" stroke="#111A2E" stroke-width="2"/>
<text x="505.0" y="146" font-size="17" font-weight="700" fill="#111A2E" text-anchor="middle">STM32N6570-DK</text>
<text x="505.0" y="168" font-size="14" fill="#5A6578" text-anchor="middle">μT-Kernel 3.0 gatekeeper</text>
<rect x="381" y="189" width="18" height="22" rx="4" fill="#111A2E"/>
<text x="412" y="199" font-size="17" font-weight="700" fill="#111A2E" text-anchor="start">D0</text>
<text x="412" y="216" font-size="12" fill="#5A6578" text-anchor="start">PF6 · USART2 RX</text>
<rect x="381" y="237" width="18" height="22" rx="4" fill="#111A2E"/>
<text x="412" y="247" font-size="17" font-weight="700" fill="#111A2E" text-anchor="start">D1</text>
<text x="412" y="264" font-size="12" fill="#5A6578" text-anchor="start">PD5 · USART2 TX</text>
