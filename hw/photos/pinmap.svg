<text x="140.0" y="203" font-size="15" font-weight="700" fill="#111A2E" text-anchor="middle">USB-TTL (PL2303)</text>
<text x="140.0" y="223" font-size="12" fill="#5A6578" text-anchor="middle">USB end → Jetson</text>
<text x="56" y="261" font-size="13" fill="#5A6578">TXD</text>
<rect x="96" y="248" width="26" height="13" rx="3" fill="#2F9E44"/>
<path d="M 240 254 H 310.5 V 200 H 381" fill="none" stroke="#2F9E44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="287" font-size="13" fill="#5A6578">RXD</text>
<rect x="96" y="274" width="26" height="13" rx="3" fill="#FFFFFF" stroke="#111A2E" stroke-width="1"/>
<path d="M 240 280 H 310.5 V 248 H 381" fill="none" stroke="#9AA6BA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 240 280 H 310.5 V 248 H 381" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="313" font-size="13" fill="#5A6578">GND</text>
<rect x="96" y="300" width="26" height="13" rx="3" fill="#111A2E"/>
<path d="M 240 306 H 310.5 V 296 H 381" fill="none" stroke="#111A2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="353" font-size="13" fill="#5A6578">USART2 · 115200 8N1 · 15-byte CMD @ 100 Hz</text>
<text x="40" y="375" font-size="13" fill="#E8590C" font-weight="700">red +5 V wire is left unconnected</text>
