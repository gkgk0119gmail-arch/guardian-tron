<rect x="776" y="454" width="26" height="13" rx="3" fill="#8B5E34"/>
<text x="812" y="467" font-size="13" fill="#5A6578">TX</text>
<path d="M 629 428 H 694.5 V 460 H 760" fill="none" stroke="#8B5E34" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="776" y="480" width="26" height="13" rx="3" fill="#111A2E"/>
<text x="812" y="493" font-size="13" fill="#5A6578">GND</text>
<path d="M 629 476 H 694.5 V 486 H 760" fill="none" stroke="#111A2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="960" y="533" font-size="13" fill="#5A6578" text-anchor="end">USART3, TX/RX swapped in software · 38400 8N1</text>
<text x="960" y="555" font-size="13" fill="#E8590C" font-weight="700" text-anchor="end">the red VESC wire is a signal, not 5 V</text>
<text x="28" y="548" font-size="14" font-weight="700" fill="#111A2E">Wire colours</text>
<rect x="28" y="570" width="26" height="13" rx="3" fill="#2F9E44"/>
<text x="62" y="581" font-size="13" fill="#5A6578">green: Jetson → STM32 (D0)</text>
<rect x="358" y="570" width="26" height="13" rx="3" fill="#FFFFFF" stroke="#111A2E" stroke-width="1"/>
<text x="392" y="581" font-size="13" fill="#5A6578">white: STM32 → Jetson (D1)</text>
<rect x="688" y="570" width="26" height="13" rx="3" fill="#111A2E"/>
<text x="722" y="581" font-size="13" fill="#5A6578">black: GND, both links</text>
<rect x="28" y="596" width="26" height="13" rx="3" fill="#C92A2A"/>
<text x="62" y="607" font-size="13" fill="#5A6578">red: STM32 → VESC RX (D5)</text>
<rect x="358" y="596" width="26" height="13" rx="3" fill="#8B5E34"/>
<text x="392" y="607" font-size="13" fill="#5A6578">brown: VESC TX → STM32 (A5)</text>
</svg>